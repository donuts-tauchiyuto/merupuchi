<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>めるぷちオーディション レク日程調整</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    
    :root { 
      --primary-pink: #ff52a2; /* めるぷちピンク */
      --accent-cyan: #00d4d4;  /* めるぷち水色 */
      --bg-top: #e6fcff;       /* 背景グラデーション上 */
      --bg-bottom: #ffeaf3;    /* 背景グラデーション下 */
      --card-bg: #ffffff; 
      --text-main: #4a4a4a; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%); 
      background-attachment: fixed;
      color: var(--text-main); 
      font-family: 'Noto Sans JP', sans-serif; 
      min-height: 100vh; 
      padding: 20px 16px 50px; 
    }

    /* ▼ テキストタイトル用のスタイル */
    .hero-header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .badge { 
      display: inline-block; 
      background: linear-gradient(90deg, var(--primary-pink), var(--accent-cyan)); 
      color: #fff; font-size: 0.85rem; font-weight: 900; 
      padding: 6px 18px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 12px; 
      box-shadow: 0 3px 8px rgba(0, 212, 212, 0.2);
    }
    .main-title { 
      font-size: 1.5rem; font-weight: 900; color: var(--primary-pink); 
      line-height: 1.4; text-shadow: 0 2px 5px rgba(255, 82, 162, 0.15);
    }

    /* ▼ フォーム全体のポップな枠線 */
    .form-card { 
      background: var(--card-bg); 
      border: 3px solid var(--accent-cyan); 
      border-radius: 24px; 
      padding: 28px 20px; 
      box-shadow: 0 8px 0 var(--accent-cyan); 
      width: 100%; 
      max-width: 500px; 
      margin: 0 auto; 
    }

    .status-bar { text-align: center; background: #fff0f5; color: var(--primary-pink); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 0.9rem; border: 2px dashed var(--primary-pink); font-weight: 900; }
    
    .form-group { margin-bottom: 24px; width: 100%; }
    label { display: flex; align-items: center; font-size: 0.9rem; font-weight: 900; color: #555; margin-bottom: 10px; }
    .req { background: var(--primary-pink); color: #fff; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; margin-left: 8px; }
    
    input[type="text"], input[type="date"], input[type="time"] { 
      width: 100%; max-width: 100%; -webkit-appearance: none; appearance: none; 
      background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px; padding: 14px; 
      color: #333; font-size: 1rem; outline: none; font-family: inherit; font-weight: 700;
    }
    input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus { 
      border-color: var(--accent-cyan); background: #fff; box-shadow: 0 0 0 3px rgba(0, 212, 212, 0.1); 
    }

    .time-flex { display: flex; align-items: center; gap: 10px; }
    .time-flex span { font-weight: 900; color: var(--primary-pink); }

    .submit-btn { 
      width: 100%; padding: 18px; 
      background: linear-gradient(135deg, #ff7eb3 0%, var(--primary-pink) 100%); 
      border: none; border-radius: 40px; color: #fff; font-size: 1.2rem; font-weight: 900; 
      letter-spacing: 2px; cursor: pointer; 
      box-shadow: 0 6px 15px rgba(255, 82, 162, 0.4); margin-top: 10px; 
      transition: 0.2s;
    }
    .submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(255, 82, 162, 0.4); }
    
    .loading { display: none; text-align: center; color: var(--primary-pink); margin-top: 16px; font-size: 0.95rem; font-weight: bold; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="hero-header">
    <div class="badge">オーディション2027</div>
    <h1 class="main-title">面談日程のご登録</h1>
  </div>

  <div class="form-card">
    <div id="statusMessage" class="status-bar">LINE連携を確認中...🔄</div>

    <form id="scheduleForm">
      <div class="form-group">
        <label>お名前（フルネーム） <span class="req">必須</span></label>
        <input type="text" id="realName" placeholder="例：山田 花子" required>
      </div>

      <div class="form-group">
        <label>面談希望日 <span class="req">必須</span></label>
        <input type="date" id="hopeDate" required>
      </div>

      <div class="form-group">
        <label>希望時間帯 <span class="req">必須</span></label>
        <div class="time-flex">
          <input type="time" id="startTime" required>
          <span>〜</span>
          <input type="time" id="endTime" required>
        </div>
      </div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="submitSchedule()">送信する</button>
      <div id="loading" class="loading">送信中...✨</div>
    </form>
  </div>

  <script>
    // ▼ ここに【日程調整用】の新しいLIFF IDを入れてください
    const LIFF_ID = "2012578157-JoAjVpvX";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              document.getElementById("statusMessage").innerText = "🌸 " + profile.displayName + " 様の日程調整";
            })
            .catch(err => {
              document.getElementById("statusMessage").innerText = "❌ プロフィール取得失敗";
            });
        })
        .catch(err => {
          document.getElementById("statusMessage").innerText = "❌ LIFF初期化エラー";
        });
    });

    function submitSchedule() {
      const form = document.getElementById("scheduleForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const btn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      btn.disabled = true;
      loading.style.display = "block";
      loading.innerText = "送信中...✨";

      const name = document.getElementById("realName").value;
      const dateVal = document.getElementById("hopeDate").value; 
      const startT = document.getElementById("startTime").value; 
      const endT = document.getElementById("endTime").value; 

      // 日付をGASが読み取れるフォーマット（YYYY年MM月DD日）に変換
      const d = new Date(dateVal);
      const yyyy = d.getFullYear();
      const mm = d.getMonth() + 1;
      const dd = d.getDate();

      // LINEに送信するテキスト（※GASの抽出プログラムと一言一句合わせる必要があります）
      const messageText = `面談希望日のご連絡\nお名前：${name}\n希望日：${yyyy}年${mm}月${dd}日\n時間帯：${startT}〜${endT}`;

      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: messageText }])
          .then(() => {
            loading.innerText = "送信完了しました！🌸\n（画面を閉じてください）";
            liff.closeWindow();
          })
          .catch((err) => {
            loading.innerText = "❌ 送信エラーが発生しました。権限設定を確認してください。";
            btn.disabled = false;
          });
      } else {
        loading.innerText = "送信完了しました！🌸\n（PCブラウザ等ではLINEに自動送信されません）";
      }
    }
  </script>
</body>
</html>
