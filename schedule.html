<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>めるぷちオーディション2027 エントリー</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    
    :root { 
      --primary-pink: #ff52a2; /* めるぷちピンク */
      --accent-cyan: #00d4d4;  /* めるぷち水色 */
      --bg-top: #e6fcff;       /* 背景グラデーション上 */
      --bg-bottom: #ffeaf3;    /* 背景グラデーション下 */
      --card-bg: #ffffff; 
      --text-main: #4a4a4a; 
      --border-color: #bdf2f2; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%); 
      background-attachment: fixed;
      color: var(--text-main); 
      font-family: 'Noto Sans JP', sans-serif; 
      min-height: 100vh; 
      padding: 20px 16px 50px; 
    }

    /* ▼ テキストタイトル用のスタイル */
    .hero-header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .badge { 
      display: inline-block; 
      background: linear-gradient(90deg, var(--primary-pink), var(--accent-cyan)); 
      color: #fff; font-size: 0.85rem; font-weight: 900; 
      padding: 6px 18px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 12px; 
      box-shadow: 0 3px 8px rgba(0, 212, 212, 0.2);
    }
    .main-title { 
      font-size: 1.7rem; font-weight: 900; color: var(--primary-pink); 
      line-height: 1.4; text-shadow: 0 2px 5px rgba(255, 82, 162, 0.15);
    }

    /* ▼ フォーム全体のポップな枠線 */
    .form-card { 
      background: var(--card-bg); 
      border: 3px solid var(--accent-cyan); 
      border-radius: 24px; 
      padding: 28px 20px; 
      box-shadow: 0 8px 0 var(--accent-cyan); 
      width: 100%; 
      max-width: 500px; 
      margin: 0 auto; 
    }

    .status-bar { text-align: center; background: #fff0f5; color: var(--primary-pink); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 0.9rem; border: 2px dashed var(--primary-pink); font-weight: 900; }
    .form-group { margin-bottom: 24px; width: 100%; }
    label { display: flex; align-items: center; font-size: 0.9rem; font-weight: 900; color: #555; margin-bottom: 10px; }
    
    .req { background: var(--primary-pink); color: #fff; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; margin-left: 8px; }
    .opt { background: var(--accent-cyan); color: #fff; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; margin-left: 8px; }
    
    input[type="text"], input[type="date"] { 
      width: 100%; max-width: 100%; -webkit-appearance: none; appearance: none; 
      background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px; padding: 14px; 
      color: #333; font-size: 1rem; outline: none; font-family: inherit; font-weight: 700;
    }
    input[type="text"]:focus, input[type="date"]:focus { 
      border-color: var(--accent-cyan); background: #fff; box-shadow: 0 0 0 3px rgba(0, 212, 212, 0.1); 
    }

    .radio-group { display: flex; gap: 12px; width: 100%; }
    .radio-btn { 
      flex: 1; display: flex; align-items: center; justify-content: center; 
      background: #fafafa; border: 2px solid #e0e0e0; padding: 14px 0; 
      border-radius: 12px; cursor: pointer; font-size: 0.95rem; color: #666; font-weight: 900; 
      transition: 0.2s;
    }
    .radio-btn input { display: none; }
    .radio-btn:has(input:checked) { 
      background: var(--primary-pink); border-color: var(--primary-pink); color: #fff; 
      box-shadow: 0 4px 10px rgba(255, 82, 162, 0.3);
    }
    #agencyNameGroup { display: none; }

    .submit-btn { 
      width: 100%; padding: 18px; 
      background: linear-gradient(135deg, #ff7eb3 0%, var(--primary-pink) 100%); 
      border: none; border-radius: 40px; color: #fff; font-size: 1.2rem; font-weight: 900; 
      letter-spacing: 2px; cursor: pointer; 
      box-shadow: 0 6px 15px rgba(255, 82, 162, 0.4); margin-top: 10px; 
      transition: 0.2s;
    }
    .submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(255, 82, 162, 0.4); }
    
    .loading { display: none; text-align: center; color: var(--primary-pink); margin-top: 16px; font-size: 0.95rem; font-weight: bold; line-height: 1.5; }
    .already-submitted { display: none; text-align: center; padding: 30px 10px; }
    .already-submitted h2 { color: var(--primary-pink); font-size: 1.3rem; margin-bottom: 12px; }
    .already-submitted p { color: #666; font-size: 0.9rem; line-height: 1.6; font-weight: 700;}
  </style>
</head>
<body>

  <!-- トップタイトル -->
  <div class="hero-header">
    <div class="badge">オーディション2027</div>
    <h1 class="main-title">めるぷち<br>エントリー登録</h1>
  </div>

  <div class="form-card">
    <div id="statusMessage" class="status-bar">LINE連携を確認中...🔄</div>

    <form id="auditionForm">
      <div class="form-group">
        <label>本名 <span class="req">必須</span></label>
        <input type="text" id="realName" placeholder="例：山田 花子" required>
      </div>
      
      <div class="form-group">
        <label>ユーザーID（ミクチャID） <span class="opt">任意</span></label>
        <input type="text" id="mixchannelId" placeholder="例：12345678">
      </div>

      <div class="form-group">
        <label>生年月日 <span class="req">必須</span></label>
        <input type="date" id="birthDate" required>
      </div>

      <div class="form-group">
        <label>事務所所属 <span class="req">必須</span></label>
        <div class="radio-group">
          <label class="radio-btn"><input type="radio" name="agency" value="あり" onchange="toggleAgencyInput(true)" required>あり</label>
          <label class="radio-btn"><input type="radio" name="agency" value="なし" onchange="toggleAgencyInput(false)">なし</label>
        </div>
      </div>

      <div class="form-group" id="agencyNameGroup">
        <label>事務所名 <span class="req">必須</span></label>
        <input type="text" id="agencyName" placeholder="例：○○プロダクション">
      </div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="submitData()">エントリー完了</button>
      <div id="loading" class="loading">送信中...✨</div>
    </form>

    <div id="alreadySubmitted" class="already-submitted">
      <h2>✅ すでに回答済みです</h2>
      <p>ご登録ありがとうございます！<br>エントリー情報はすでに正常に受け付けられております。</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012578157-J4tWQCHC";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzU8XDm2tGy32LN7Ik1P7_jm5sZEJl9N6pFqQsz-VZLptao3NBan4PQSN4az4pl0tzuvw/exec";

    let lineUserId = "";
    let lineDisplayName = "";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              lineUserId = profile.userId;
              lineDisplayName = profile.displayName;
              
              document.getElementById("statusMessage").innerText = "🌸 " + profile.displayName + " 様のエントリー";
              checkAlreadySubmitted(profile.userId);
            })
            .catch(err => {
              document.getElementById("statusMessage").innerText = "❌ プロフィール取得失敗: " + err.message;
            });
        })
        .catch(err => {
          document.getElementById("statusMessage").innerText = "❌ LIFF初期化エラー: " + err.message;
        });
    });

    function toggleAgencyInput(show) {
      const group = document.getElementById("agencyNameGroup");
      const input = document.getElementById("agencyName");
      if (show) {
        group.style.display = "block";
        input.required = true;
      } else {
        group.style.display = "none";
        input.required = false;
        input.value = "";
      }
    }

    function checkAlreadySubmitted(userId) {
      fetch(`${GAS_URL}?userId=${encodeURIComponent(userId)}`)
        .then(res => res.json())
        .then(data => {
          if (data.isSubmitted) {
            document.getElementById("auditionForm").style.display = "none";
            document.getElementById("statusMessage").style.display = "none";
            document.getElementById("alreadySubmitted").style.display = "block";
          }
        })
        .catch(() => {});
    }

    function submitData() {
      const form = document.getElementById("auditionForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const btn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      btn.disabled = true;
      loading.style.display = "block";
      loading.innerText = "送信中...✨";

      const payload = {
        displayName: lineDisplayName, 
        realName: document.getElementById("realName").value, 
        lineUserId: lineUserId, 
        mixchannelId: document.getElementById("mixchannelId").value, 
        birthDate: document.getElementById("birthDate").value, 
        agency: document.querySelector('input[name="agency"]:checked')?.value, 
        agencyName: document.getElementById("agencyName").value 
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        loading.innerText = "送信完了しました！🌸\n（画面を閉じてください）";
        if (liff.isInClient()) {
          liff.sendMessages([{ type: 'text', text: '回答しました！' }])
            .then(() => liff.closeWindow())
            .catch(() => liff.closeWindow());
        } else {
          setTimeout(() => { window.close(); }, 1500);
        }
      })
      .catch(err => {
        loading.innerText = "❌ 通信エラーが発生しました。GASのURLや権限設定を確認してください。";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
