<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>めるぷちオーディション2027 エントリーフォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    
    :root { --primary-pink: #e6005c; --accent-red: #ff3366; --bg-light: #fff5f7; --card-bg: #ffffff; --text-main: #333333; --border-color: #ffccd5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-light); background-image: radial-gradient(circle at 50% 0%, #ffe6eb 0%, var(--bg-light) 100%); color: var(--text-main); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; padding: 20px 16px 40px; }
    .hero-header { text-align: center; margin-bottom: 20px; }
    .badge { display: inline-block; background: linear-gradient(90deg, var(--primary-pink), var(--accent-red)); color: #fff; font-size: 0.75rem; font-weight: 900; padding: 4px 14px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 8px; }
    .main-title { font-size: 1.4rem; font-weight: 900; color: var(--primary-pink); line-height: 1.3; }
    .form-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 24px 18px; box-shadow: 0 10px 25px rgba(230, 0, 92, 0.08); width: 100%; max-width: 500px; margin: 0 auto; }
    .status-bar { text-align: center; background: #fff0f3; color: var(--primary-pink); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; border: 1px solid var(--border-color); font-weight: 700; }
    .form-group { margin-bottom: 20px; width: 100%; }
    label { display: flex; align-items: center; font-size: 0.85rem; font-weight: 700; color: #444; margin-bottom: 8px; }
    .req { background: var(--primary-pink); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    .opt { background: #aaa; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    input[type="text"], input[type="date"] { width: 100%; max-width: 100%; -webkit-appearance: none; appearance: none; background: #fafafa; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #333; font-size: 1rem; outline: none; font-family: inherit; box-sizing: border-box; min-height: 48px; }
    input[type="text"]:focus, input[type="date"]:focus { border-color: var(--primary-pink); background: #fff; }
    .radio-group { display: flex; gap: 10px; width: 100%; }
    .radio-btn { flex: 1; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 1px solid var(--border-color); padding: 12px 0; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: #666; font-weight: 700; min-height: 48px; text-align: center; }
    .radio-btn input { display: none; }
    .radio-btn:has(input:checked) { background: var(--primary-pink); border-color: var(--primary-pink); color: #fff; }
    #agencyNameGroup { display: none; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary-pink) 0%, var(--accent-red) 100%); border: none; border-radius: 30px; color: #fff; font-size: 1.1rem; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 15px rgba(230, 0, 92, 0.3); margin-top: 10px; }
    .loading { display: none; text-align: center; color: var(--primary-pink); margin-top: 12px; font-size: 0.95rem; font-weight: bold; }
    .already-submitted { display: none; text-align: center; padding: 30px 10px; }
    .already-submitted h2 { color: var(--primary-pink); font-size: 1.3rem; margin-bottom: 12px; }
    .already-submitted p { color: #666; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="hero-header">
    <div class="badge">第14回</div>
    <h1 class="main-title">めるぷちオーディション2027<br>エントリーフォーム</h1>
  </div>

  <div class="form-card">
    <div id="statusMessage" class="status-bar">LINE連携を確認中...🔄</div>

    <form id="auditionForm">
      <div class="form-group">
        <label>本名 <span class="req">必須</span></label>
        <input type="text" id="realName" placeholder="例：山田 花子" required>
      </div>
      
      <div class="form-group">
        <label>ユーザーID（ミクチャID） <span class="opt">任意</span></label>
        <input type="text" id="mixchannelId" placeholder="例：12345678">
      </div>

      <div class="form-group">
        <label>生年月日 <span class="req">必須</span></label>
        <input type="date" id="birthDate" required>
      </div>

      <div class="form-group">
        <label>事務所所属 <span class="req">必須</span></label>
        <div class="radio-group">
          <label class="radio-btn"><input type="radio" name="agency" value="あり" onchange="toggleAgencyInput(true)" required>あり</label>
          <label class="radio-btn"><input type="radio" name="agency" value="なし" onchange="toggleAgencyInput(false)">なし</label>
        </div>
      </div>

      <div class="form-group" id="agencyNameGroup">
        <label>事務所名 <span class="req">必須</span></label>
        <input type="text" id="agencyName" placeholder="例：○○プロダクション">
      </div>

      <div class="form-group">
        <label>許諾の有無 <span class="req">必須</span></label>
        <div class="radio-group">
          <label class="radio-btn"><input type="radio" name="permission" value="あり" required>あり</label>
          <label class="radio-btn"><input type="radio" name="permission" value="なし">なし</label>
        </div>
      </div>

      <button type="button" class="submit-btn" id="submitBtn" onclick="submitData()">エントリー完了</button>
      <div id="loading" class="loading">送信中...✨</div>
    </form>

    <div id="alreadySubmitted" class="already-submitted">
      <h2>✅ すでに回答済みです</h2>
      <p>ご登録ありがとうございます！<br>エントリー情報はすでに正常に受け付けられております。</p>
    </div>
  </div>

  <script>
    // ▼ここに新しいLIFF IDとGAS URLを入れてください
    const LIFF_ID = "2012578157-J4tWQCHC";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzU8XDm2tGy32LN7Ik1P7_jm5sZEJl9N6pFqQsz-VZLptao3NBan4PQSN4az4pl0tzuvw/exec";

    let lineUserId = "";
    let lineDisplayName = "";

    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          liff.getProfile()
            .then(profile => {
              lineUserId = profile.userId;
              lineDisplayName = profile.displayName;
              
              document.getElementById("statusMessage").innerText = "🌸 " + profile.displayName + " 様のエントリー";
              checkAlreadySubmitted(profile.userId);
            })
            .catch(err => {
              document.getElementById("statusMessage").innerText = "❌ プロフィール取得失敗: " + err.message;
            });
        })
        .catch(err => {
          document.getElementById("statusMessage").innerText = "❌ LIFF初期化エラー: " + err.message;
        });
    });

    function toggleAgencyInput(show) {
      const group = document.getElementById("agencyNameGroup");
      const input = document.getElementById("agencyName");
      if (show) {
        group.style.display = "block";
        input.required = true;
      } else {
        group.style.display = "none";
        input.required = false;
        input.value = "";
      }
    }

    function checkAlreadySubmitted(userId) {
      fetch(`${GAS_URL}?userId=${encodeURIComponent(userId)}`)
        .then(res => res.json())
        .then(data => {
          if (data.isSubmitted) {
            document.getElementById("auditionForm").style.display = "none";
            document.getElementById("statusMessage").style.display = "none";
            document.getElementById("alreadySubmitted").style.display = "block";
          }
        })
        .catch(() => {});
    }

    function submitData() {
      const form = document.getElementById("auditionForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      document.getElementById("loading").style.display = "block";

      const payload = {
        displayName: lineDisplayName, // B列：LINE名
        realName: document.getElementById("realName").value, // C列：本名
        lineUserId: lineUserId, // D列：LINE ID
        mixchannelId: document.getElementById("mixchannelId").value, // E列：ミクチャID
        birthDate: document.getElementById("birthDate").value, // F列：生年月日
        agency: document.querySelector('input[name="agency"]:checked')?.value, // H列
        agencyName: document.getElementById("agencyName").value, // I列
        permission: document.querySelector('input[name="permission"]:checked')?.value // J列
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });

      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: '回答しました！' }])
          .then(() => liff.closeWindow())
          .catch(() => liff.closeWindow());
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
